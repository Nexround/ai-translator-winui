name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Publish self-contained x64 build
        run: >-
          dotnet publish AiTranslator.WinUI.csproj
          -c Release
          -r win-x64
          --self-contained true
          -p:Platform=x64
          -o artifacts/win-x64

      - name: Create archive
        shell: pwsh
        run: Compress-Archive -Path artifacts/win-x64/* -DestinationPath ai-translator-winui-x64.zip

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: ai-translator-winui-x64.zip
          generate_release_notes: true
