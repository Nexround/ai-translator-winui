name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Build x64 MSIX
        shell: pwsh
        run: .\installer\build-msix.ps1 -Configuration Release -Platform x64 -OutputDirectory artifacts/msix

      - name: Create archive
        shell: pwsh
        run: Compress-Archive -Path artifacts/msix/* -DestinationPath ai-translator-winui-x64-msix.zip

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ai-translator-winui-x64-msix.zip
            artifacts/msix/*.msix
          generate_release_notes: true
