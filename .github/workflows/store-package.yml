name: Microsoft Store package

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build ${{ matrix.platform }} MSIX
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: x64
            runner: windows-latest
          - platform: x86
            runner: windows-latest
          # ARM64 MSIX packaging invokes native SDK resource tools. Build it
          # on an ARM64 runner so mt.exe and MrmSupport.dll match the host.
          - platform: ARM64
            runner: windows-11-arm

    runs-on: ${{ matrix.runner }}

    steps:
      - uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      # Store submissions do not need a publisher certificate. Microsoft
      # re-signs the package after certification.
      - name: Build unsigned Store MSIX
        shell: pwsh
        run: >-
          .\installer\build-msix.ps1
          -Configuration Release
          -Platform ${{ matrix.platform }}
          -OutputDirectory "artifacts/store-${{ matrix.platform }}"

      - name: Upload Store package
        uses: actions/upload-artifact@v4
        with:
          name: AiTranslator-Store-${{ matrix.platform }}
          path: artifacts/store-${{ matrix.platform }}/*.msix
          if-no-files-found: error
